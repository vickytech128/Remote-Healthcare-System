name: Backend CI

on:
  push:
    branches: [ "main", "backend-patient-portal" ]
  pull_request:
    branches: [ "main", "backend-patient-portal" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci || npm install
      
    - name: Start Server (Dry Run)
      run: |
        # Quick syntax check to make sure server.js doesn't instantly crash
        node -e "require('./server.js'); console.log('Server files required successfully'); process.exit(0);"
